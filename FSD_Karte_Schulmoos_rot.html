const map = L.map('map', {zoomControl:true});
const imagery = L.tileLayer(

  {maxZoom:20, attribution:'Tiles © Esri'}
).addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap'});
L.control.layers({'Luftbild':imagery,'Karte':osm}).addTo(map);

function style(f) {
 const isGraben = (f.properties.source||'').includes('Grabenmahd');
 return {
   color: isGraben ? '#e31b23' : '#0877d1',
   weight: isGraben ? 5 : 3,
   opacity: .95,
   fillColor: isGraben ? '#e31b23' : '#0877d1',
   fillOpacity: isGraben ? .32 : .18
 };
}
const layer=L.geoJSON(geo,{
 style:style,
 pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,...style(f)}),
 onEachFeature:(f,l)=>{
   const p=f.properties||{};
   l.bindPopup('<b>'+((p.name||'Fläche'))+'</b><br>'+((p.source||'')));
 }
}).addTo(map);
if(layer.getBounds().isValid()) map.fitBounds(layer.getBounds(),{padding:[25,25]}); else map.setView([48.3,11.7],13);

let userMarker,userCircle;
function locateMe(){
 if(!navigator.geolocation) return alert('GPS wird von diesem Browser nicht unterstützt.');
 navigator.geolocation.getCurrentPosition(pos=>{
   const ll=[pos.coords.latitude,pos.coords.longitude];
   if(userMarker) map.removeLayer(userMarker);
   if(userCircle) map.removeLayer(userCircle);
   userMarker=L.marker(ll).addTo(map).bindPopup('Mein Standort').openPopup();
   userCircle=L.circle(ll,{radius:pos.coords.accuracy}).addTo(map);
   map.setView(ll,17);
 },err=>alert('Standort konnte nicht ermittelt werden. Bitte Standortfreigabe aktivieren.'),{enableHighAccuracy:true});
}
